[package]
name = "qemu0"
version = "0.1.0"
edition = "2021"
description = "qemu0 (bare-metal RV64IMA emulator) and spike0 (pk-like user-mode runner)"

[lib]
name = "rvcore"
path = "src/lib.rs"

[[bin]]
name = "qemu0"
path = "src/main.rs"

[[bin]]
name = "spike0"
path = "src/bin/spike0.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
